<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="t">
<title id="t">Illustration of the battery ecosystem: solar panels and wind turbines feed a battery research lab, grid-scale battery storage, homes with batteries, an EV charging station and electric vehicles, with a battery recycling plant closing the loop.</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d4ecf3"/><stop offset="1" stop-color="#e8f5f9"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fa3d1"/><stop offset="1" stop-color="#2a7fb8"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2f5d8a"/><stop offset="1" stop-color="#1d3f63"/>
  </linearGradient>
  <g id="turbine">
    <rect x="-3" y="0" width="6" height="170" rx="3" fill="#f4f7f9" stroke="#c9d3da"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <path d="M0 0 C6 -20 5 -55 0 -70 C-5 -55 -6 -20 0 0Z" fill="#fff" stroke="#c9d3da"/>
      <path d="M0 0 C6 -20 5 -55 0 -70 C-5 -55 -6 -20 0 0Z" fill="#fff" stroke="#c9d3da" transform="rotate(120)"/>
      <path d="M0 0 C6 -20 5 -55 0 -70 C-5 -55 -6 -20 0 0Z" fill="#fff" stroke="#c9d3da" transform="rotate(240)"/>
    </g>
    <circle r="6" fill="#e3e9ee" stroke="#b9c5ce"/>
  </g>
  <g id="solar">
    <path d="M0 18 L14 0 H66 L52 18Z" fill="url(#panel)" stroke="#9fb6c9" stroke-width="1.2"/>
    <path d="M17 0 L3 18 M30 0 L16 18 M43 0 L29 18 M56 0 L42 18 M7 9 H59" stroke="#7fa3c4" stroke-width=".8"/>
    <rect x="24" y="18" width="3" height="10" fill="#8a99a6"/>
  </g>
  <g id="cloud">
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="#fff" opacity=".85"/>
    <ellipse cx="-22" cy="-10" rx="24" ry="17" fill="#fff" opacity=".85"/>
    <ellipse cx="16" cy="-14" rx="28" ry="20" fill="#fff" opacity=".85"/>
  </g>
  <g id="tree">
    <rect x="-2" y="0" width="4" height="14" fill="#7a6a55"/>
    <circle cy="-6" r="11" fill="#6fae5a"/><circle cx="-6" cy="-1" r="7" fill="#5f9e4c"/>
  </g>
  <g id="bolt"><path d="M3 -10 L-5 2 H0 L-3 10 L5 -2 H0Z" fill="#ffd34d"/></g>
  <g id="pylon" fill="none" stroke="#8d99a3" stroke-width="2">
    <path d="M-16 140 L-4 0 L4 0 L16 140 M-10 70 H10 M-13 105 H13 M-7 35 H7 M-16 140 L10 70 M16 140 L-10 70 M-10 70 L7 35 M10 70 L-7 35"/>
    <path d="M-34 14 H34 M-28 40 H28" stroke-width="2.5"/>
  </g>
  <g id="car">
    <path d="M0 18 V10 Q2 4 10 3 L18 -5 Q22 -8 30 -8 H44 Q50 -8 54 -3 L60 3 Q68 4 70 10 V18Z" fill="currentColor"/>
    <path d="M21 -3 L26 -6 H36 V3 H16Z M39 -6 H44 Q48 -6 51 -2 L55 3 H39Z" fill="#cfe9f5"/>
    <circle cx="16" cy="18" r="6" fill="#2d3a44"/><circle cx="16" cy="18" r="2.5" fill="#cfd6db"/>
    <circle cx="55" cy="18" r="6" fill="#2d3a44"/><circle cx="55" cy="18" r="2.5" fill="#cfd6db"/>
  </g>
</defs>

